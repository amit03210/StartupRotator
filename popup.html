<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 320px;
        padding: 15px;
        font-family: Arial, sans-serif;
      }
      h3 {
        margin-top: 0;
      }
      textarea {
        width: 100%;
        height: 180px;
        margin-bottom: 10px;
        box-sizing: border-box;
        resize: none;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #45a049;
      }
      #status {
        color: green;
        display: none;
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h3>Startup URLs</h3>
    <p style="font-size: 13px; color: #555">
      Enter one URL per line. On each Chrome startup, a random URL is selected
      without repeats until every URL has been used. The cycle resets daily.
    </p>
    <textarea
      id="urlList"
      placeholder="https://google.com&#10;https://youtube.com"
    ></textarea>
    <button id="saveBtn">Save URLs</button>
    <div id="status">List saved successfully!</div>

    <script src="popup.js"></script>
  </body>
</html>
